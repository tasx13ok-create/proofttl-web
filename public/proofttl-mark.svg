<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ProofTTL symbol</title>
  <desc id="desc">A silver proof loop with an integrated verification mark</desc>
  <defs>
    <linearGradient id="silver" x1="35" y1="22" x2="210" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".22" stop-color="#d5e0e6"/><stop offset=".5" stop-color="#7e929f"/><stop offset=".72" stop-color="#f5f8fa"/><stop offset="1" stop-color="#aebcc4"/>
    </linearGradient>
    <linearGradient id="shine" x1="62" y1="56" x2="204" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".95"/><stop offset=".5" stop-color="#cbd9e1" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
