    <path d="M83 77c15-17 43-25 66-15 21 9 33 31 29 51-4 22-24 38-47 38-21 0-40-13-47-33-6-16-3-30  -1-41Z" stroke="#f7fbfd" stroke-opacity=".34" stroke-width="3"/>
    <path d="M93 137 112 155 166 93" stroke="url(#shine)" stroke-width="17"/>
    <path d="M94 137 112 153 164 94" stroke="#ffffff" stroke-opacity=".72" stroke-width="3"/>
