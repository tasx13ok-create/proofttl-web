name: Apply Edon XR Production Renderer

on:
  push:
    branches: [main]
    paths:
      - '.xr-patch/APPLY'

permissions:
  contents: write

concurrency:
  group: apply-edon-xr-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct and verify production XR source
        run: |
          set -euo pipefail
          for f in .xr-patch/page-00.b64 .xr-patch/page-01.b64 .xr-patch/page-02.b64 .xr-patch/page-03.b64 .xr-patch/page-04.b64; do test -f "$f"; done
          cat .xr-patch/page-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/edon-ar-page.tsx
          test "$(sha256sum /tmp/edon-ar-page.tsx | cut -d' ' -f1)" = "b8c6a82f154da88acc66c05c255be7dbf7e43476fb9993ae550c46d964eef295"
          test "$(sha256sum public/edon-live/web/app/ar/xrRenderer.ts | cut -d' ' -f1)" = "15692a2bbf02f4d1e7d72f08b113910631d96680874d393892e862196f539088"
          mv /tmp/edon-ar-page.tsx public/edon-live/web/app/ar/page.tsx
          grep -F "new EdonXrRenderer(gl)" public/edon-live/web/app/ar/page.tsx
          grep -F "renderer.render(baseLayer,pose" public/edon-live/web/app/ar/page.tsx
          grep -F "gl.bindFramebuffer(gl.FRAMEBUFFER,baseLayer.framebuffer)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "for(const view of pose.views)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "gl.drawArrays(gl.TRIANGLES,0,6)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "PHONE → PC → PERCEPTION  //  NOT QUEST CAMERA" public/edon-live/web/app/ar/xrRenderer.ts
      - name: Commit canonical production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .xr-patch
          git add -A .xr-patch public/edon-live/web/app/ar/page.tsx public/edon-live/web/app/ar/xrRenderer.ts
          git commit -m 'Render Edon perception directly in Quest WebXR compositor'
          git pull --rebase origin main
          git push
