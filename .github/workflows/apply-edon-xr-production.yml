name: Apply Edon XR Production Renderer

on:
  push:
    branches: [main]
    paths:
      - '.xr-patch/APPLY'

permissions:
  contents: write

concurrency:
  group: apply-edon-xr-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and verify production XR source
        run: |
          set -euo pipefail
          for f in .xr-patch/page-00.b64 .xr-patch/page-01.b64 .xr-patch/page-02.b64 .xr-patch/page-03.b64 .xr-patch/page-04.b64 .xr-patch/renderer-00.b64 .xr-patch/renderer-01a.b64 .xr-patch/renderer-01b.b64 .xr-patch/renderer-01c.b64 .xr-patch/renderer-01d.b64 .xr-patch/renderer-02.b64 .xr-patch/renderer-03.b64; do test -f "$f"; done
          test "$(wc -c < .xr-patch/page-00.b64)" -eq 8000
          test "$(wc -c < .xr-patch/page-01.b64)" -eq 8000
          test "$(wc -c < .xr-patch/page-02.b64)" -eq 8000
          test "$(wc -c < .xr-patch/page-03.b64)" -eq 8000
          test "$(wc -c < .xr-patch/page-04.b64)" -eq 4104
          test "$(wc -c < .xr-patch/renderer-00.b64)" -eq 6000
          test "$(wc -c < .xr-patch/renderer-01a.b64)" -eq 2000
          test "$(wc -c < .xr-patch/renderer-01b.b64)" -eq 2000
          test "$(wc -c < .xr-patch/renderer-01c.b64)" -eq 1864
          test "$(wc -c < .xr-patch/renderer-01d.b64)" -eq 136
          test "$(wc -c < .xr-patch/renderer-02.b64)" -eq 6000
          test "$(wc -c < .xr-patch/renderer-03.b64)" -eq 2936
          cat .xr-patch/page-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/edon-ar-page.tsx
          cat .xr-patch/renderer-*.b64 | tr -d '\n\r' | base64 --decode > /tmp/edon-xr-renderer.ts
          test "$(sha256sum /tmp/edon-ar-page.tsx | cut -d' ' -f1)" = "e1b328debe3ee192f77b0122a209ce15ebbbec38605dc0885196cf14106a657a"
          test "$(sha256sum /tmp/edon-xr-renderer.ts | cut -d' ' -f1)" = "3ae6617d95db4e496334092c897b760aadd5976e1208cc06d2a48f1e34f7f64e"
          mv /tmp/edon-ar-page.tsx public/edon-live/web/app/ar/page.tsx
          mv /tmp/edon-xr-renderer.ts public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "new EdonXrRenderer(gl)" public/edon-live/web/app/ar/page.tsx
          grep -F "renderer.render(baseLayer,pose" public/edon-live/web/app/ar/page.tsx
          grep -F "gl.bindFramebuffer(gl.FRAMEBUFFER,baseLayer.framebuffer)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "for(const view of pose.views)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "gl.drawArrays(gl.TRIANGLES,0,6)" public/edon-live/web/app/ar/xrRenderer.ts
          grep -F "PHONE → PC → PERCEPTION  //  NOT QUEST CAMERA" public/edon-live/web/app/ar/xrRenderer.ts
      - name: Commit canonical production source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .xr-patch
          git add -A .xr-patch public/edon-live/web/app/ar/page.tsx public/edon-live/web/app/ar/xrRenderer.ts
          git commit -m 'Render Edon perception directly in Quest WebXR compositor'
          git pull --rebase origin main
          git push
