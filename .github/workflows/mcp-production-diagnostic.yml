name: MCP production diagnostic

on:
  push:
    branches: [fix-mcp-live-smoke]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print production MCP responses
        shell: bash
        run: |
          set -u
          URL="https://proofttl-web.vercel.app/api/mcp"
          echo '=== initialize ==='
          curl -i --silent --show-error -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-diagnostic","version":"1.0"}}}'
          echo
          echo '=== tools/list ==='
          curl -i --silent --show-error -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          echo
          echo '=== status ==='
          curl -i --silent --show-error -X POST "$URL" -H 'content-type: application/json' -H 'accept: application/json' --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"proofttl_status","arguments":{}}}'
