name: MCP live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test deployed MCP contract and unpaid verification boundary
        run: node scripts/mcp-live-smoke.mjs
        env:
          MCP_WAIT_ATTEMPTS: 90
