name: MCP live smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for branch preview and test MCP
        shell: bash
        run: |
          set -euo pipefail
          URL="https://proofttl-web.vercel.app/api/mcp"

          request() {
            curl --fail-with-body --silent --show-error               -X POST "$URL"               -H 'content-type: application/json'               -H 'accept: application/json'               --data "$1"
          }

          ready=0
          for i in {1..24}; do
            if out="$(request '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"github-smoke","version":"1.0"}}}' 2>/tmp/mcp-curl.err)"; then
              echo "$out" | jq -e '.result.serverInfo.name == "proofttl"' >/dev/null
              ready=1
              break
            fi
            cat /tmp/mcp-curl.err || true
            sleep 5
          done
          test "$ready" -eq 1

          tools="$(request '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          echo "$tools" | jq -e '[.result.tools[].name] | index("proofttl_status") != null' >/dev/null
          echo "$tools" | jq -e '[.result.tools[].name] | index("proofttl_get_fact_lease") != null' >/dev/null

          status="$(request '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"proofttl_status","arguments":{}}}')"
          echo "$status" | jq -e '.result.isError == false' >/dev/null
          echo "$status" | jq -e '.result.structuredContent.service == "proofttl"' >/dev/null
          echo "$status" | jq -e '.result.structuredContent.protocol == "ProofTTL/0.3.1"' >/dev/null

          modern="$(curl --fail-with-body --silent --show-error             -X POST "$URL"             -H 'content-type: application/json'             -H 'accept: application/json'             -H 'MCP-Protocol-Version: 2026-07-28'             -H 'Mcp-Method: server/discover'             --data '{"jsonrpc":"2.0","id":4,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"github-smoke","version":"1.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}')"
          echo "$modern" | jq -e '.result.supportedVersions | index("2026-07-28") != null' >/dev/null
          echo "ProofTTL MCP live preview smoke passed."
