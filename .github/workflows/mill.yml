name: MILL opportunity loop

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: mill-opportunity-loop
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run opportunity hunter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MILL_MODEL: ${{ vars.MILL_MODEL }}
        run: node scripts/mill-loop.mjs

      - name: Commit changed state
        run: |
          if git diff --quiet -- public/mill-state.json; then
            echo "No state change."
            exit 0
          fi
          git config user.name "mill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/mill-state.json
          git commit -m "MILL: refresh opportunity queue"
          git push
